[workspace]
members = [
    "crates/image-colorizer-core",
    "crates/image-colorizer-cli",
    "crates/image-colorizer-web",
]
resolver = "2"

[workspace.package]
version = "1.1.7"
authors = ["Taylor Beeston <beeston.taylor@gmail.com>"]
edition = "2021"
description = "Never settle for images outside your colorscheme again!"
repository = "https://github.com/TaylorBeeston/image-colorizer"
license = "MIT"
readme = "README.md"
keywords = ["image", "color", "gpu", "webgpu", "wgsl"]
categories = ["multimedia::images", "graphics"]

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.6", features = ["multipart"] }
bytemuck = { version = "1.13", features = ["derive"] }
clap = "3.2"
config = "0.13"
dirs = "5.0"
futures = "0.3"
image = "0.24.6"
indicatif = "0.17.3"
palette = "0.7.2"
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = "1.0"
serde_json = "1.0"
serde_derive = "1.0"
tokio = { version = "1.28", features = ["full"] }
toml = "0.7"
wgpu = "0.16"
