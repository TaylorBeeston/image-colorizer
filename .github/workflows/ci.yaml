name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - webgpu-static

permissions:
  contents: read

jobs:
  test:
    name: Test workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --workspace -- --test-threads=1

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check static JavaScript syntax
        run: |
          node --check crates/image-colorizer-web/static/app.js
          node --check crates/image-colorizer-web/static/colorizer.js
          node --check crates/image-colorizer-web/static/cpu_colorizer.js
          node --check crates/image-colorizer-web/static/cpu_worker.js

  wasm:
    name: Rebuild WASM package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Rebuild browser CPU fallback
        run: wasm-pack build crates/image-colorizer-web --target web --out-dir /tmp/image-colorizer-web-pkg --release

      - name: Check generated WASM package
        run: |
          test -s /tmp/image-colorizer-web-pkg/image_colorizer_web_bg.wasm
          test -s /tmp/image-colorizer-web-pkg/image_colorizer_web.js
          test -s /tmp/image-colorizer-web-pkg/image_colorizer_web.d.ts
          test -s crates/image-colorizer-web/static/pkg/image_colorizer_web_bg.wasm
